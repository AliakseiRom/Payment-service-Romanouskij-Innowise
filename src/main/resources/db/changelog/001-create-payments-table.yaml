databaseChangeLog:
  - changeSet:
      id: 1
      author: Aliaksei

      changes:
        - createTable:
            tableName: payments
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_payments

              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: payment_timestamp
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: payment_amount
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false

        - createIndex:
            tableName: payments
            indexName: idx_payments_order_id
            columns:
              - column:
                  name: order_id

        - createIndex:
            tableName: payments
            indexName: idx_payments_user_id
            columns:
              - column:
                  name: user_id

        - createIndex:
            tableName: payments
            indexName: idx_payments_status
            columns:
              - column:
                  name: status

        - createIndex:
            tableName: payments
            indexName: idx_payments_payment_timestamp
            columns:
              - column:
                  name: payment_timestamp